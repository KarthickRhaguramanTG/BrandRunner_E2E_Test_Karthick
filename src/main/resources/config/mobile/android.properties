# Android capability defaults. Override any value with -D<key>=... or an environment variable.
#
# deviceName/platformVersion/appPath below apply ONLY to executionTarget=emulator
# or executionTarget=physical. When executionTarget=browserstack these are
# ignored entirely - device identity and the app come from browserstack.properties
# instead (browserstack.device/browserstack.osVersion/browserstack.app), so a
# BrowserStack session never ends up with two contradictory device descriptions.
automationName=UiAutomator2
deviceName=Pixel_9_Pro
platformVersion=16
noReset=false
fullReset=false

# BrandRunners (com.brandrunners) app-release.apk - versionName 1.31, minSdk 24,
# targetSdk 36. Confirmed compatible with the configured emulator (Android 16 /
# API 36, x86_64) - both platformVersion and native ABI match exactly. Values
# extracted directly from the APK via `aapt dump badging`, not assumed.
appPath=C:/Users/samuel.manoj/Downloads/QAS.apk/app-release.apk
appPackage=com.brandrunners
appActivity=com.brandrunners.MainActivity
# udid=                (required when executionTarget=physical)
