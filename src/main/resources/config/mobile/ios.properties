# iOS capability defaults.
# Local execution (simulator or physical) requires macOS + Xcode + the XCUITest
# driver, and is NOT possible from Windows. See README for details and use
# BrowserStack for iOS execution on non-macOS machines.
#
# deviceName/platformVersion/appPath below apply ONLY to executionTarget=simulator
# or executionTarget=physical. When executionTarget=browserstack these are
# ignored entirely - device identity and the app come from browserstack.properties
# instead (browserstack.device/browserstack.osVersion/browserstack.app).
automationName=XCUITest
deviceName=iPhone 16
platformVersion=18.0
noReset=false
fullReset=false

# appPath=test-data/mobile/ios/App.app
# bundleId=
# udid=                (required when executionTarget=physical)
