# Shared/default mobile automation settings.
# platform: android | ios              (override with -Dplatform=... or PLATFORM env var)
# executionTarget: emulator | simulator | physical | browserstack
#                                       (override with -DexecutionTarget=... or EXECUTION_TARGET env var)
platform=android
executionTarget=emulator

appiumServerUrl=http://127.0.0.1:4723
newCommandTimeoutSeconds=120

# EXAMPLE test data for the demo smoke tests - replace with real values once
# locators.properties points at a real app.
test.validUsername=demoUser
test.validPassword=demoPass123
